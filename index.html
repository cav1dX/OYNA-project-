@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let pinSel=0;
const R={
home(){const tg=all().filter(g=>!g.day);return `<section class="hero"><h1>Bu gün hansı oyunu oynayırsan?</h1><p>Bakıdakı oyunları, meydançaları və oyunçuları kəşf et. Öz oyununu yarat və sənə qoşulacaq insanları tap.</p><div class="row"><a class="btn p" href="#/games">Oyun tap</a><a class="btn" href="#/explore">Meydança tap</a></div></section>
<section class="sec"><div class="row"><h2>Bu gün keçirilən oyunlar</h2><a class="mu" href="#/games">Hamısı</a></div><div class="grid">${tg.slice(0,4).map(gcard).join('')}</div></section>
<section class="sec"><div class="row"><h2>Sizə yaxın meydançalar</h2><a class="mu" href="#/explore">Xəritə</a></div><div class="grid">${V.slice(0,3).map(vcard).join('')}</div></section>
<section class="sec"><div class="row"><h2>Yaxınlaşan turnirlər</h2><a class="mu" href="#/tournaments">Hamısı</a></div><div class="grid">${TR.slice(0,2).map(tcard).join('')}</div></section>
<section class="sec"><h2 style="margin-bottom:14px">Bakıdakı icmaları kəşf et</h2><div class="grid">${CM.map(ccard).join('')}</div></section>
<footer><h1 style="font-size:clamp(32px,7vw,64px)">Oyunun başlayır.</h1><div class="row" style="margin-top:20px"><a class="btn p" href="#/create">Oyun yarat</a></div><p class="mu" style="margin-top:30px;font-size:13px">OYNA — Find your game. Play. Meet. Compete. Nümunə məlumatlar.</p></footer>`},
games(){let l=all();if(F.s>=0)l=l.filter(g=>g.s==F.s);if(F.l>=0)l=l.filter(g=>g.l==F.l);if(F.fr)l=l.filter(g=>F.fr==1?!g.pr:g.pr>0);if(F.tab==1)l=l.filter(g=>!g.day);if(F.tab==2)l=l.filter(g=>g.day);if(F.tab==3)l=l.filter(g=>vn(g.v).d=='Nəsimi'||vn(g.v).d=='Nərimanov'||vn(g.v).d=='Səbail');
l.sort((a,b)=>a.day-b.day||a.tm.localeCompare(b.tm));
return `<div class="row" style="justify-content:space-between"><h1 style="font-size:40px">Oyunlar</h1><a class="btn p" href="#/create">${ic('plus')}Oyun yarat</a></div><div class="chips" role="tablist">${['Bütün oyunlar','Bu gün','Sabah','Sizə yaxın'].map((t,i)=>`<button role="tab" class="chip ${F.tab==i?'on':''}" data-a="tab" data-id="${i}">${t}</button>`).join('')}</div>${chips()}<div class="sel" style="margin-bottom:14px"><select data-f="l" aria-label="Səviyyə"><option value="-1">Səviyyə: hamısı</option>${LV.map((x,i)=>`<option value="${i}" ${F.l==i?'selected':''}>${x}</option>`).join('')}</select><select data-f="fr" aria-label="Qiymət"><option value="0">Qiymət: hamısı</option><option value="1" ${F.fr==1?'selected':''}>Pulsuz</option><option value="2" ${F.fr==2?'selected':''}>Ödənişli</option></select></div><div class="grid">${l.map(gcard).join('')||''}</div>${l.length?'':empty('Bu filterlərə uyğun oyun yoxdur.','Yeni oyun yarat','#/create')}`},
game(id){const g=all().find(x=>x.id==id);if(!g)return empty('Oyun tapılmadı.','Oyunlara qayıt','#/games');const v=vn(g.v),c=cnt(g),j=st.j.includes(g.id);
const sl=Array.from({length:g.m},(_,i)=>i<c?`<div class="av f" title="Oyunçu">${i==0?ini(g.h):i==c-1&&j?'Sən':PL[i%6][1][0].toUpperCase()}</div>`:`<div class="av x" aria-label="Boş yer">${i+1}</div>`).join('');
return `<a class="mu" href="#/games">Oyunlar</a><div class="two" style="margin-top:12px"><div><span class="tag a">${SP[g.s]}</span><h1 style="font-size:44px;margin:12px 0">${esc(g.t)}</h1><div class="meta" style="font-size:15px"><span>${ic('clock')}${dn(g.day)}, ${g.tm}</span><span>${ic('pin')}<a href="#/venue/${v.id}">${esc(v.n)}</a></span></div>
<div class="stat"><div><b>${c}/${g.m}</b><span>Oyunçular</span></div><div><b style="font-size:16px;padding:4px 0">${LV[g.l].split(' ')[0]}</b><span>Səviyyə</span></div><div><b>${g.pr||'0'}</b><span>AZN</span></div><div><b style="font-size:16px;padding:4px 0">${g.h.split(' ')[0]}</b><span>Təşkilatçı</span></div></div>
<h3>Oyunçular</h3><div class="slots">${sl}</div>
<div class="row"><button class="btn p" data-a="join" data-id="${g.id}" ${c>=g.m&&!j?'disabled':''}>${j?'Oyundan çıx':c>=g.m?'Oyun doludur':'Oyuna qoşul'}</button><button class="btn" data-a="share">${ic('share')}Paylaş</button><button class="btn" data-a="invite">Oyunçu dəvət et</button><button class="btn" data-a="report">Şikayət et</button></div>
${j?`<div class="card" style="margin-top:20px"><h3>Oyun söhbəti</h3><p class="mu" style="margin-top:6px">${g.h}: Gəlirsiz? Top məndə olacaq.</p></div>`:''}</div>${mapEl([v],0)}</div>`},
explore(){const l=V.filter(v=>F.s<0||v.s.includes(F.s));return `<h1 style="font-size:40px">Kəşf et</h1>${chips()}<div class="two"><div>${mapEl(l,pinSel)}</div><div class="grid" style="grid-template-columns:1fr">${l.map(vcard).join('')||empty('Bu idman növü üçün məkan yoxdur.')}</div></div>`},
venue(id){const v=vn(id);if(!v)return empty('Məkan tapılmadı.');const gs=all().filter(g=>g.v==v.id&&!g.day);
return `<a class="mu" href="#/explore">Kəşf et</a><div class="two" style="margin-top:12px"><div><div class="row"><span class="tag ${v.f?'a':''}">${v.f?'Pulsuz':'Ödənişli'}</span><span class="tag">${v.in?'Qapalı':'Açıq'}</span><span class="tag">${v.r} · ${v.rc} rəy</span></div><h1 style="font-size:42px;margin:12px 0">${esc(v.n)}</h1><div class="meta" style="font-size:15px"><span>${ic('pin')}${v.d}, ${v.a}</span><span>${ic('clock')}${v.h}</span><span>${v.f?'Pulsuz':v.p+' AZN-dən'}</span></div>
<h2 style="margin:30px 0 12px">Bu məkanda bu gün</h2>${gs.length?`<div class="grid" style="grid-template-columns:1fr">${gs.map(gcard).join('')}</div>`:empty('Bu gün bu məkanda oyun yoxdur.','Oyun yarat','#/create')}
<h2 style="margin:30px 0 12px">İmkanlar</h2><div class="row" style="gap:6px">${v.fc.map(f=>`<span class="tag">${f}</span>`).join('')}</div><h2 style="margin:30px 0 12px">İdman növləri</h2><div class="row" style="gap:6px">${v.s.map(i=>`<span class="tag a">${SP[i]}</span>`).join('')}</div></div>${mapEl([v],0)}</div>`},
players(){return `<h1 style="font-size:40px">Oyunçular</h1>${chips()}<div class="grid">${PL.filter(p=>F.s<0||p[2]==F.s).map(p=>`<article class="card"><div class="row"><div class="av f">${ini(p[0])}</div><div><h3>${p[0]}</h3><span class="mu" style="font-size:13px">@${p[1]} · ${p[6]}</span></div></div><div class="meta" style="margin:12px 0"><span>${SP[p[2]]}</span><span>${LV[p[3]]}</span><span>${p[4]} oyun</span><span>Fair play ${p[5]}%</span></div><button class="btn sm" data-a="inv">Dəvət et</button></article>`).join('')||''}</div>`},
communities(){return `<h1 style="font-size:40px;margin-bottom:16px">İcmalar</h1><div class="grid">${CM.map(ccard).join('')}</div>`},
tournaments(){return `<h1 style="font-size:40px;margin-bottom:16px">Turnirlər</h1><div class="grid">${TR.map(tcard).join('')}</div>
<section class="sec"><h2 style="margin-bottom:6px">${TR[0][0]}: final cədvəli</h2><p class="mu">Yarımfinal və final mərhələsi</p><div class="br" tabindex="0" aria-label="Turnir cədvəli"><div><small>Yarımfinal</small>${mt(['Gənclik Qartalları',21,1],['Nərimanov 3x3',17,0])}${mt(['Yasamal Blok',15,0],['Səbail Kings',19,1])}</div><div><small>Final</small>${mt(['Gənclik Qartalları',0,0],['Səbail Kings',0,0])}</div></div><button class="btn p" data-a="reg">Turnirdə iştirak et</button></section>`},
create(){const w=W,sts=['İdman növü','Vaxt','Məkan','Təfərrüat','Yoxla'];let b='';
if(w.step==0)b=`<div class="opt">${SP.map((s,i)=>`<button class="${w.s==i?'on':''}" data-a="w" data-k="s" data-id="${i}">${s}</button>`).join('')}</div>`;
if(w.step==1)b=`<div class="opt">${['Bu gün','Sabah'].map((s,i)=>`<button class="${w.day==i?'on':''}" data-a="w" data-k="day" data-id="${i}">${s}</button>`).join('')}</div><label for="tm">Saat</label><input id="tm" type="time" value="${w.tm}">`;
if(w.step==2)b=`<div class="opt">${V.map(v=>`<button class="${w.v==v.id?'on':''}" data-a="w" data-k="v" data-id="${v.id}">${esc(v.n)}</button>`).join('')}</div>`;
if(w.step==3)b=`<label for="tt">Oyunun adı</label><input id="tt" maxlength="50" value="${esc(w.t)}" placeholder="Məs: Basketbol 3x3"><label>Səviyyə</label><div class="opt">${LV.map((s,i)=>`<button class="${w.l==i?'on':''}" data-a="w" data-k="l" data-id="${i}">${s}</button>`).join('')}</div><label for="mx">Maksimum oyunçu</label><input id="mx" type="number" min="2" max="30" value="${w.m}"><label for="pr">Qiymət (AZN, 0 = pulsuz)</label><input id="pr" type="number" min="0" value="${w.pr}"><label for="ds">Təsvir</label><textarea id="ds" maxlength="200">${esc(w.ds)}</textarea>`;
if(w.step==4)b=`<div class="card"><h3>${esc(w.t||SP[w.s]+' oyunu')}</h3><div class="meta" style="margin-top:8px"><span>${SP[w.s]}</span><span>${dn(w.day)}, ${w.tm}</span><span>${vn(w.v).n}</span><span>${LV[w.l]}</span><span>${w.m} oyunçu</span><span>${price(w.pr)}</span></div></div>`;
return `<div style="max-width:600px"><h1 style="font-size:36px;margin-bottom:16px">Oyun yarat</h1><div class="steps">${sts.map((_,i)=>`<i class="${i<=w.step?'on':''}"></i>`).join('')}</div><h2 style="margin-bottom:12px">${sts[w.step]}</h2>${b}<div class="row" style="margin-top:24px">${w.step?'<button class="btn" data-a="back">Geri</button>':''}<button class="btn p" data-a="next">${w.step==4?'Oyunu yarat':'Davam et'}</button></div></div>`},
profile(){const my=all().filter(g=>st.j.includes(g.id));return `<div class="row"><div class="av f" style="width:72px;height:72px;font-size:22px">CM</div><div><h1 style="font-size:32px">Cavid Qədirli</h1><span class="mu">@cavid · Nəsimi</span></div></div><p class="mu" style="margin-top:12px">Basketbol və padel. Həftə içi axşamlar oynayıram.</p><div class="stat"><div><b>48</b><span>Oyun</span></div><div><b>27</b><span>Qələbə</span></div><div><b>56%</b><span>Qələbə faizi</span></div><div><b>96%</b><span>Fair play</span></div></div>
<h2 style="margin:24px 0 12px">Qoşulduğum oyunlar</h2>${my.length?`<div class="grid">${my.map(gcard).join('')}</div>`:empty('Hələ heç bir oyuna qoşulmamısınız.','Oyun tap','#/games')}
<h2 style="margin:30px 0 12px">Sevimli məkanlar</h2>${st.f.length?`<div class="grid">${st.f.map(i=>vcard(vn(i))).join('')}</div>`:empty('Sevimli məkan yoxdur.','Meydança tap','#/explore')}
<h2 style="margin:30px 0 12px">Bildirişlər</h2><div class="card">Elvin M. sizi Basketbol 3x3 oyununa dəvət etdi.</div>`}};

R.notifications=()=>{const n=[['Elvin M. sizi Basketbol 3x3 oyununa dəvət etdi.','#/games/1'],['Bu axşam 20:00: Basketbol 3x3 oyunu başlayır.','#/games/1'],['Leyla Hüseynova yeni mesaj göndərdi.','#/messages'],['Bakı Yay Kuboku 3x3 üçün qeydiyyat açıldı.','#/tournaments']];return `<h1 style="font-size:40px;margin-bottom:16px">Bildirişlər</h1><div class="grid" style="grid-template-columns:1fr">${n.map(x=>`<a class="card" href="${x[1]}">${x[0]}</a>`).join('')}</div>`};
const seedM={d1:[['Leyla Hüseynova','Bu gün padel oynayırsan?']],d2:[['Tural Qasımov','Sabah basketbola gəlirsən?']]};
const thr=()=>[...all().filter(g=>st.j.includes(g.id)).map(g=>({id:'g'+g.id,n:g.t+', '+vn(g.v).d+', '+g.tm,m:[[g.h,'Hamı hazırdır?']]})),{id:'d1',n:'Leyla Hüseynova',m:seedM.d1},{id:'d2',n:'Tural Qasımov',m:seedM.d2}];
R.messages=()=>{const T2=thr(),c=T2.find(t=>t.id==F.th);const all2=t=>[...t.m.map(x=>({a:x[0],t:x[1]})),...((st.c||{})[t.id]||[])];
return `<h1 style="font-size:40px;margin-bottom:16px">Mesajlar</h1><div class="two" style="grid-template-columns:${c?'1fr':'1fr'}"><div class="card" style="padding:0">${T2.map(t=>{const u=!(st.r||[]).includes(t.id);return `<button class="th ${c&&c.id==t.id?'on':''}" data-a="th" data-id="${t.id}"><span>${esc(t.n)}</span>${u?'<span class="tag a">1</span>':''}</button>`}).join('')}</div>${c?`<div class="card"><h3>${esc(c.n)}</h3><div style="margin:12px 0;min-height:140px">${all2(c).map(m=>`<div class="bub ${m.me?'me':''}"><small>${m.a||'Sən'}</small>${esc(m.t)}</div>`).join('')}</div><form id="mf" class="row" style="flex-wrap:nowrap"><input id="mi" maxlength="300" placeholder="Mesaj yaz" aria-label="Mesaj"><button class="btn p" aria-label="Göndər">${ic('share')}</button></form></div>`:empty('Söhbət seçin.')}</div>`};
R.search=()=>`<h1 style="font-size:40px;margin-bottom:16px">Axtarış</h1><input id="q" type="search" placeholder="Məkan, oyun, oyunçu, icma, turnir" aria-label="Axtarış" autofocus><div id="res" style="margin-top:16px"></div>`;
const find=q=>{q=q.toLowerCase().trim();if(!q)return '';const h=[];const L=(t,a)=>a.length&&h.push(`<h3 style="margin:18px 0 8px">${t}</h3><div class="grid">${a.join('')}</div>`);
L('Məkanlar',V.filter(v=>(v.n+v.d).toLowerCase().includes(q)).map(vcard));L('Oyunlar',all().filter(g=>(g.t+SP[g.s]).toLowerCase().includes(q)).map(gcard));
L('Oyunçular',PL.filter(p=>(p[0]+p[1]).toLowerCase().includes(q)).map(p=>`<a class="card" href="#/players">${p[0]} <span class="mu">@${p[1]}</span></a>`));
L('İcmalar',CM.filter(c=>c[0].toLowerCase().includes(q)).map(ccard));L('Turnirlər',TR.filter(t=>t[0].toLowerCase().includes(q)).map(tcard));
return h.join('')||empty('Nəticə tapılmadı.')};
document.addEventListener('input',e=>{if(e.target.id=='q')$('#res').innerHTML=find(e.target.value)});
document.addEventListener('change',e=>{const k=e.target.dataset.f;if(k){F[k]=+e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id!='mf')return;e.preventDefault();const v=$('#mi').value.trim();if(!v)return;st.c=st.c||{};(st.c[F.th]=st.c[F.th]||[]).push({me:1,t:v});save();render();const i=$('#mi');i&&i.focus()});
function ccard(c){return `<article class="card"><span class="tag a">${SP[c[2]]}</span><h3 style="margin:12px 0 6px">${c[0]}</h3><p class="mu" style="font-size:14px">${c[4]}</p><div class="row" style="margin-top:14px;justify-content:space-between"><span class="meta"><span>${ic('users')}${c[3]} üzv</span></span><button class="btn sm" data-a="comm">İcmaya qoşul</button></div></article>`}
function tcard(t){return `<article class="card"><div class="row" style="justify-content:space-between"><span class="tag a">${t[6]}</span><span class="mu">${t[2]}</span></div><h3 style="margin:16px 0 6px">${t[0]}</h3><div class="meta"><span>${ic('trophy')}${SP[t[1]]}</span><span>${ic('pin')}${t[3]}</span><span>${ic('users')}${t[4]} komanda</span><span>Giriş ${t[5]}</span></div></article>`}
function mt(a,b){return `<div class="m">${[a,b].map(x=>`<div class="${x[2]?'w':''}"><span>${x[0]}</span><b>${x[1]||'—'}</b></div>`).join('')}</div>`}
function render(){const h=(location.hash||'#/').slice(2).split('/'),r=h[0]||'home';
$('#app').innerHTML=r=='game'||r=='games'&&h[1]?R.game(h[1]):r=='venue'?R.venue(h[1]):(R[r]||R.home)();
const cur={'':0,home:0,explore:1,venue:1,games:2,game:2,create:2,communities:3,profile:4}[r];
document.querySelectorAll('#links a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+a.dataset.r));
document.querySelectorAll('#tabs a').forEach((a,i)=>a.classList.toggle('on',i==cur));
document.title='OYNA — '+({games:'Oyunlar',explore:'Kəşf et',players:'Oyunçular',communities:'İcmalar',tournaments:'Turnirlər',create:'Oyun yarat'}[r]||'Oyun tap');scrollTo(0,0)}
function init(){const rs=['explore','games','players','communities','tournaments'];
$('#links').innerHTML=rs.map((r,i)=>`<a href="#/${r}" data-r="${r}">${T.nav[i]}</a>`).join('');
$('#tabs').innerHTML=[['home','','home'],['search','explore',''],['ball','games',''],['users','communities',''],['user','profile','']].map((t,i)=>`<a href="#/${t[1]}">${ic(t[0])}${T.tabs[i]}</a>`).join('');
$('#fab').innerHTML=ic('plus')+'Oyun yarat';$('#bell').innerHTML=ic('bell');$('#sb').innerHTML=ic('search');$('#mb').innerHTML=ic('msg');$('#pf').innerHTML=ic('user');
const L=()=>{$('#lang').innerHTML=['AZ','EN','RU'].map(l=>`<button class="${l=='AZ'?'on':''}" data-a="lang" data-id="${l}" aria-label="Dil ${l}">${l}</button>`).join('')};L()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id;
if(a=='fav'){e.preventDefault();st.f=st.f.includes(id)?st.f.filter(x=>x!=id):[...st.f,id];save();render()}
else if(a=='join'){const g=all().find(x=>x.id==id);if(st.j.includes(id)){st.j=st.j.filter(x=>x!=id);toast('Oyundan çıxdınız.')}else if(cnt(g)>=g.m)toast('Bu oyun artıq doludur.');else{st.j.push(id);toast('Oyuna qoşuldunuz.')}save();render()}
else if(a=='sp'){F.s=id;render()}else if(a=='tab'){F.tab=id;render()}
else if(a=='th'){F.th=b.dataset.id;st.r=[...(st.r||[]),F.th];save();render()}else if(a=='pin'){pinSel=id;render()}
else if(a=='w'){W[b.dataset.k]=id;render()}
else if(a=='back'){W.step--;render()}
else if(a=='next'){if(W.step==1)W.tm=$('#tm').value||W.tm;if(W.step==3){W.t=$('#tt').value.trim();W.m=Math.max(2,+$('#mx').value||10);W.pr=Math.max(0,+$('#pr').value||0);W.ds=$('#ds').value}
if(W.step<4){W.step++;render()}else{const g={id:100+st.g.length,s:W.s,t:W.t||SP[W.s]+' oyunu',v:W.v,day:W.day,tm:W.tm,l:W.l,m:W.m,n:1,pr:W.pr,h:'Cavid M.'};st.g.push(g);st.j.push(g.id);save();W={step:0,s:0,day:0,tm:'20:00',v:1,l:2,m:10,pr:0,t:'',ds:''};toast('Oyununuz yaradıldı.');location.hash='#/games/'+g.id}}
else if(a=='share'){const u=location.href;navigator.share?navigator.share({title:'OYNA',url:u}).catch(()=>{}):(navigator.clipboard&&navigator.clipboard.writeText(u).catch(()=>{}),toast('Keçid kopyalandı.'))}
else if(a=='invite'||a=='inv')toast('Dəvət göndərildi.');else if(a=='report')toast('Şikayət qəbul edildi.');
else if(a=='reg')toast('Qeydiyyat sorğusu göndərildi.');else if(a=='comm')toast('İcmaya qoşuldunuz.');
else if(a=='lang'&&b.dataset.id!='AZ')toast('Bu dil tezliklə əlavə olunacaq.')});
addEventListener('hashchange',render);init();render();
</script>
</body>
</html>
